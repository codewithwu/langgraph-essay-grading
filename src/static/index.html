<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高考作文评分系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 40px;
        }

        /* 表单区域 */
        .form-section {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #34495e;
            margin-bottom: 6px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #dfe6e9;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafbfc;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #4a90d9;
            box-shadow: 0 0 0 3px rgba(74,144,217,0.12);
            background: #fff;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4a90d9, #357abd);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(135deg, #357abd, #2a6496);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74,144,217,0.3);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Loading 动效 */
        .loading-bar {
            display: none;
            margin-top: 16px;
            text-align: center;
        }

        .loading-bar.active { display: block; }

        .loading-dots {
            display: inline-flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #4a90d9;
            border-radius: 50%;
            animation: pulse 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .loading-text {
            font-size: 14px;
            color: #7f8c8d;
        }

        /* 评分结果区域 */
        .results-section {
            display: none;
        }

        .results-section.active { display: block; }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 16px;
            padding-left: 12px;
            border-left: 3px solid #4a90d9;
        }

        .score-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        /* 评分卡片 */
        .score-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .score-card-title {
            font-size: 15px;
            font-weight: 600;
            color: #34495e;
        }

        .score-badge {
            font-size: 20px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            min-width: 56px;
            text-align: center;
        }

        .score-high { background: #e8f5e9; color: #2e7d32; }
        .score-mid  { background: #fff3e0; color: #e65100; }
        .score-low  { background: #ffebee; color: #c62828; }

        .score-reason {
            font-size: 13px;
            color: #636e72;
            line-height: 1.7;
        }

        /* 骨架屏 */
        .skeleton-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .skeleton-line.short { width: 40%; }
        .skeleton-line.medium { width: 70%; }
        .skeleton-line.long { width: 100%; }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 总分卡片 */
        .final-score-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            color: #fff;
            animation: slideIn 0.5s ease-out;
            display: none;
        }

        .final-score-card.active { display: block; }

        .final-score-label {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .final-score-value {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -2px;
        }

        .final-score-unit {
            font-size: 16px;
            opacity: 0.5;
            margin-left: 4px;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .score-grid { grid-template-columns: 1fr; }
            .container { padding: 20px 16px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>高考作文评分系统</h1>
        <p class="subtitle">基于 LangGraph 的多维度智能评分</p>

        <div class="form-section">
            <div class="form-group">
                <label for="topic">作文题目</label>
                <input type="text" id="topic" placeholder="请输入作文题目...">
            </div>
            <div class="form-group">
                <label for="essay">作文内容</label>
                <textarea id="essay" placeholder="请输入作文内容..."></textarea>
            </div>
            <button class="btn-submit" id="btnSubmit" onclick="startGrading()">开始评分</button>
            <div class="loading-bar" id="loadingBar">
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
                <div class="loading-text" id="loadingText">智能体正在审题...</div>
            </div>
        </div>

        <div class="results-section" id="resultsSection">
            <h2 class="section-title">多维度评分</h2>
            <div class="score-grid" id="scoreGrid"></div>
            <div class="final-score-card" id="finalScoreCard">
                <div class="final-score-label">综合评分</div>
                <div class="final-score-value">
                    <span id="finalScoreValue">0</span>
                    <span class="final-score-unit">/ 1</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const NODE_LABELS = {
            check_relevance: { name: "审题立意", icon: " " },
            check_evidence:  { name: "论据分析", icon: " " },
            check_structure: { name: "结构评估", icon: " " },
            check_expression:{ name: "语言文采", icon: " " },
        };

        const LOADING_TEXTS = {
            check_relevance: "智能体正在审题...",
            fan_out: "审题完成，正在启动多维度并行评分...",
            check_evidence: "正在分析论据...",
            check_structure: "正在评估结构...",
            check_expression: "正在鉴赏语言...",
            calculate_final_score: "正在计算综合评分...",
        };

        function getScoreClass(score) {
            if (score >= 0.8) return "score-high";
            if (score >= 0.6) return "score-mid";
            return "score-low";
        }

        function createSkeletonCard() {
            const card = document.createElement("div");
            card.className = "skeleton-card";
            card.innerHTML = `
                <div class="skeleton-line short"></div>
                <div class="skeleton-line long"></div>
                <div class="skeleton-line medium"></div>
            `;
            return card;
        }

        function createScoreCard(dim, data) {
            const info = NODE_LABELS[dim];
            const score = data.score;
            const card = document.createElement("div");
            card.className = "score-card";
            card.innerHTML = `
                <div class="score-card-header">
                    <span class="score-card-title">${info.icon} ${info.name}</span>
                    <span class="score-badge ${getScoreClass(score)}">${score.toFixed(2)}</span>
                </div>
                <p class="score-reason">${data.reason}</p>
            `;
            return card;
        }

        function showResults() {
            document.getElementById("resultsSection").classList.add("active");
        }

        function setLoadingText(text) {
            document.getElementById("loadingText").textContent = text;
        }

        async function startGrading() {
            const topic = document.getElementById("topic").value.trim();
            const essay = document.getElementById("essay").value.trim();

            if (!topic || !essay) {
                alert("请填写作文题目和内容");
                return;
            }

            // 重置状态
            const btn = document.getElementById("btnSubmit");
            const loadingBar = document.getElementById("loadingBar");
            const scoreGrid = document.getElementById("scoreGrid");
            const finalCard = document.getElementById("finalScoreCard");
            const resultsSection = document.getElementById("resultsSection");

            btn.disabled = true;
            btn.textContent = "评分中...";
            loadingBar.classList.add("active");
            resultsSection.classList.remove("active");
            finalCard.classList.remove("active");
            scoreGrid.innerHTML = "";
            setLoadingText(LOADING_TEXTS.check_relevance);

            // 骨架屏占位
            const skeletonSlots = {};
            ["check_evidence", "check_structure", "check_expression"].forEach(dim => {
                const skeleton = createSkeletonCard();
                skeleton.style.display = "none";
                skeletonSlots[dim] = skeleton;
            });

            try {
                const response = await fetch("/api/essays/grade/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ topic, sample_essay: essay }),
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                let currentEvent = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith("event:")) {
                            currentEvent = line.slice(6).trim();
                        } else if (line.startsWith("data:")) {
                            const jsonStr = line.slice(5).trim();
                            try {
                                const data = JSON.parse(jsonStr);
                                handleEvent(currentEvent, data, scoreGrid, skeletonSlots);
                            } catch {}
                        }
                    }
                }
            } catch (err) {
                alert("评分请求失败: " + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "开始评分";
                loadingBar.classList.remove("active");
            }
        }

        function handleEvent(eventName, data, scoreGrid, skeletonSlots) {
            // 更新 loading 文字
            if (LOADING_TEXTS[eventName]) {
                setLoadingText(LOADING_TEXTS[eventName]);
            }

            showResults();

            // check_relevance: 直接展示卡片
            if (eventName === "check_relevance" && data.update && data.update.relevance) {
                const card = createScoreCard("check_relevance", data.update.relevance);
                scoreGrid.appendChild(card);

                // 显示三个骨架屏
                Object.values(skeletonSlots).forEach(s => {
                    s.style.display = "block";
                    scoreGrid.appendChild(s);
                });
                return;
            }

            // fan_out: 已经在 check_relevance 后展示了骨架屏
            if (eventName === "fan_out") return;

            // 并行评分节点：替换骨架屏
            if (skeletonSlots[eventName] && data.update) {
                const dim = eventName.replace("check_", "");
                const detail = data.update[dim] || data.update[eventName];
                if (detail) {
                    const card = createScoreCard(eventName, detail);
                    scoreGrid.replaceChild(card, skeletonSlots[eventName]);
                    delete skeletonSlots[eventName];
                }
                return;
            }

            // 最终评分
            if (eventName === "calculate_final_score" && data.update && data.update.final_score !== undefined) {
                document.getElementById("finalScoreValue").textContent = data.update.final_score.toFixed(2);
                document.getElementById("finalScoreCard").classList.add("active");
                return;
            }

            // done
            if (data.done) {
                setLoadingText("评分完成");
            }
        }
    </script>
</body>
</html>
